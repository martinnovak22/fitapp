name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      # Node 22 matches local development, and better-sqlite3 (the SQLite
      # used by the repository tests) has prebuilt binaries for it, so
      # install does not compile it from source.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Biome
        run: yarn biome:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      # Unused files, exports and dependencies (fallow, see .fallowrc.json).
      - name: Dead code
        run: yarn deadcode

      # Native module versions match the Expo SDK and are not duplicated.
      - name: Expo doctor
        run: yarn doctor

      - name: Test (with coverage)
        run: yarn coverage

      # Bundles the app for Android with Hermes, which tsc and the node-only
      # tests never do: catches broken imports, missing assets and code
      # Hermes cannot compile before it reaches a phone.
      - name: Android bundle
        run: yarn bundle:android

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
