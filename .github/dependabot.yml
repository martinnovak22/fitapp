# Weekly update PRs. CI runs on each one; Expo SDK and React Native majors are
# upgraded by hand (`npx expo install --fix`), so Dependabot leaves them out.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Versions pinned by the Expo SDK move together with `npx expo install --fix`.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native*'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
